options {
    // BIND9公式イメージが標準で使用する、ゾーンファイルのキャッシュ用作業ディレクトリ
    directory "/var/cache/bind";
    
    // コンテナ内のすべての仮想ネットワークインターフェース（ポート53）でDNSクエリ（UDP/TCP）を受付
    listen-on port 53 { any; };
    
    // 同一カスタムネットワーク内のすべてのコンテナ（10.89.0.0/24）からの名前解決要求を許可
    allow-query { any; };
    
    // プライベートドメイン「.test」にDNS署名は実存しないため、バリデーションチェックを明示的に無効化
    dnssec-validation no;
    
    // 検証環境（コンテナ）からの外部アクセスを遮断し、インターネットへのプロキシを禁止するため
    // 外部ドメインへの再帰検索（Recursion）を「no」に強制固定。これにより検証コンテナの隔離が成立。
    recursion no;
};

// sender.test ドメインの正引きDNSレコード定義ファイルを指定
zone "sender.test" IN {
    type master;
    file "/etc/bind/sender.test.zone"; // 名前付きボリューム（dns-config）経由でマウントされる実在パス
};

// receiver.test ドメインの正引きDNSレコード定義ファイルを指定
zone "receiver.test" IN {
    type master;
    file "/etc/bind/receiver.test.zone";
};
